<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070817"><title>NovaTech — Administration</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head><body><canvas id="stars" aria-hidden="true"></canvas><header class="topbar"><a class="brand" href="/"><span class="brand-mark">N</span> Nova<span>Tech</span></a><a class="back-link" href="/">← Retour au site</a></header><main class="admin-wrap"><section class="admin-intro"><div class="eyebrow">ESPACE PRIVÉ</div><h1>Centre de <span>contrôle.</span></h1><p>Gère les messages envoyés depuis le site NovaTech.</p></section><section id="login-panel" class="admin-card"><h2>Connexion administrateur</h2><form id="login-form"><label for="username">Identifiant</label><input id="username" name="username" autocomplete="username" required value="admin"><label for="password">Mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button primary" type="submit">Se connecter ↗</button><p id="login-status" role="status"></p></form></section><section id="dashboard" hidden><div class="admin-toolbar"><div><h2>Messages reçus</h2><p id="message-count">Chargement…</p></div><button id="logout" class="button ghost">Déconnexion</button></div><input class="admin-search" id="search" placeholder="Rechercher un nom, e-mail ou sujet…"><div id="message-list" class="message-list"></div><p id="empty-state" hidden>Aucun message pour le moment.</p></section><p class="security-note">Conseil : change le mot de passe administrateur avant toute mise en ligne publique.</p></main><script src="/admin.js"></script></body></html>
